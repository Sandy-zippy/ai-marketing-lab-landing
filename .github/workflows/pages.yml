name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A guard that cannot stop a push is decoration. On 17 Sep 2026 brand-guard.mjs was
      # committed red: the assertion failed and the shell carried on to git push regardless.
      # This step is pure Node with no dependencies, so it runs on the runner and fails the
      # build BEFORE anything reaches Pages. verify.mjs cannot run here: it needs Chrome, so
      # it is wired as a local pre-push hook instead.
      - name: Brand guard
        shell: bash
        run: |
          set -euo pipefail
          node brand-guard.mjs
      # /call is the paid-traffic VSL page. Its CTA is a Razorpay link held in one constant;
      # empty means every button reads "Payment link pending". Never ship that, the page
      # without its video, or paid traffic with no pixel to measure it, to a live URL.
      - name: Call page gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'const PAY_LINK = ""' call/index.html; then echo "BLOCKED: PAY_LINK is empty in call/index.html"; exit 1; fi
          if grep -q 'const META_PIXEL_ID = ""' assets/meta-pixel.js; then echo "BLOCKED: META_PIXEL_ID is empty in assets/meta-pixel.js"; exit 1; fi
          test -s call/vsl/aiml-vsl.mp4 || { echo "BLOCKED: call/vsl/aiml-vsl.mp4 missing"; exit 1; }
          test -s call/vsl/hls/master.m3u8 || { echo "BLOCKED: call/vsl/hls/master.m3u8 missing"; exit 1; }
      - uses: actions/configure-pages@v5
      - name: Build public artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _site/assets/fonts _site/assets/og _site/vsl _site/webinar _site/start _site/workshop _site/sprint _site/resources _site/assets/photos _site/assets/proof _site/assets/work
          cp CNAME robots.txt sitemap.xml index.html thank-you.html privacy.html terms.html refund.html contact.html data-deletion.html _site/
          cp assets/analytics.js assets/site.css assets/aiml-funnel.css assets/aiml-logo-full-dark.svg assets/aiml-logo-full-light.svg assets/aiml-logo-full-onwhite.svg assets/favicon.svg assets/favicon-32.png assets/favicon-180.png assets/aiml-wordmark-v3.svg _site/assets/
          cp assets/fonts/inter-latin.woff2 assets/fonts/jetbrains-mono-latin.woff2 assets/fonts/spacemono-400-latin.woff2 assets/fonts/spacemono-700-latin.woff2 assets/fonts/INTER-LICENSE.txt assets/fonts/JETBRAINS-MONO-LICENSE.txt assets/fonts/SPACEMONO-LICENSE.txt _site/assets/fonts/
          cp assets/og/aiml-og-1200x630.jpg _site/assets/og/
          cp vsl/index.html vsl/watch.html vsl/booked.html _site/vsl/
          cp webinar/index.html _site/webinar/
          cp start/index.html _site/start/
          cp workshop/index.html _site/workshop/
          cp sprint/index.html sprint/thanks.html _site/sprint/
          # The sprint page carries real artefacts: payment emails, client work, the headshot.
          # None of these were in the copy list, so the page would have deployed with every
          # image 404ing while the HTML looked fine.
          cp assets/photos/sandy-headshot-hd.jpg _site/assets/photos/
          mkdir -p _site/assets/photos/aiml
          cp assets/photos/aiml/uab-board.jpg assets/photos/aiml/uab-desk.jpg assets/photos/aiml/uab-hero.jpg \
             assets/photos/aiml/uab-meet.jpg assets/photos/aiml/uab-notes.jpg _site/assets/photos/aiml/
          cp assets/photos/aiml/proof-phone.jpg _site/assets/photos/aiml/
          # Explicit list, same reason as assets/work above. `cp assets/proof/*.png` also
          # published crop-1..7.png, 1.1MB no deployed page references. I fixed the work
          # glob and missed its sibling one line up; an audit agent caught it.
          cp assets/proof/deck-1.png assets/proof/deck-2.png assets/proof/deck-3.png \
             assets/proof/deck-4.png assets/proof/deck-5.png assets/proof/deck-6.png \
             assets/proof/deck-7.png _site/assets/proof/
          # Redacted copies (payer personal names boxed out) used by /call and /sprint since 1 Oct 2026.
          mkdir -p _site/assets/proof/redacted
          cp assets/proof/redacted/card-1.png assets/proof/redacted/card-2.png assets/proof/redacted/card-3.png \
             assets/proof/redacted/card-4.png assets/proof/redacted/card-5.png assets/proof/redacted/card-6.png \
             assets/proof/redacted/card-7.png assets/proof/redacted/deck-1.png assets/proof/redacted/deck-2.png \
             assets/proof/redacted/deck-3.png assets/proof/redacted/deck-4.png assets/proof/redacted/deck-5.png \
             assets/proof/redacted/deck-6.png assets/proof/redacted/deck-7.png _site/assets/proof/redacted/
          # Explicit list, never a glob. `cp assets/work/*.jpg` published the PawMe robot
          # (pawme-build-poster.jpg) and four Riarh ad creatives (work-1,2,3,5.jpg) as
          # publicly reachable URLs. Sandy removed both by name. No page referenced them,
          # so every check reported them gone while the deploy kept serving them.
          cp assets/work/design-riarh.jpg assets/work/content-funnel-17sep.jpg _site/assets/work/
          cp resources/index.html _site/resources/
          mkdir -p _site/call/vsl _site/assets/brand
          cp assets/meta-pixel.js _site/assets/
          cp assets/brand/aiml-horizontal.svg assets/brand/favicon.ico assets/brand/favicon.svg \
             assets/brand/apple-touch-icon.png assets/brand/icon-192.png assets/brand/icon-512.png \
             assets/brand/maskable-512.png assets/brand/site.webmanifest assets/brand/app-icon-1024.png _site/assets/brand/
          cp call/index.html call/booked.html call/poster.jpg _site/call/
          # Motion loops for the /call and /sprint sections. Explicit list, never a glob.
          mkdir -p _site/assets/loops
          cp assets/loops/pain.mp4 assets/loops/pain.webm assets/loops/pain.jpg \
             assets/loops/system.mp4 assets/loops/system.webm assets/loops/system.jpg \
             assets/loops/sprint.mp4 assets/loops/sprint.webm assets/loops/sprint.jpg \
             assets/loops/guarantee.mp4 assets/loops/guarantee.webm assets/loops/guarantee.jpg _site/assets/loops/
          cp call/vsl/aiml-vsl.mp4 _site/call/vsl/
          cp -R call/vsl/hls _site/call/vsl/
          touch _site/.nojekyll
          node --check _site/assets/analytics.js
          node --check _site/assets/meta-pixel.js
          ! grep -RniE 'REPLACE_WITH|aimarketinglab\.club|37 of 100|#book|This Thursday|Lorem ipsum' _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
