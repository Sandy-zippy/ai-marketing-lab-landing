<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proto B: product film</title>
<link rel="stylesheet" href="base.css">
<style>
/* Product film: a real calendar app in perspective, camera pushes in on this month, pans to next month, pulls back. */
.stage{aspect-ratio:16/9;perspective:1400px}
.cam{position:absolute;left:50%;top:52%;width:1100px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(22deg) rotateZ(-6deg) scale(.62)}
.app{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cal{background:#F7FBFA;color:#121212;border-radius:14px;padding:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);font-family:Inter,sans-serif}
.cal h3{display:flex;justify-content:space-between;font:700 18px var(--mono);margin-bottom:12px}
.cal h3 em{font-style:normal;color:#00A19B}
.cal.empty h3 em{color:#B4241A}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g div{height:64px;border-radius:8px;background:#EAF1F0;padding:6px;font:11px var(--mono);color:#7E7E7E;position:relative}
.ev{position:absolute;left:6px;right:6px;bottom:6px;padding:4px 6px;border-radius:6px;background:#00A19B;color:#fff;font:700 10px var(--mono);transform:scale(0);transform-origin:left bottom;transition:transform .45s var(--ease),background .5s}
.ev.on{transform:scale(1)}
.ev.dl{background:#8FB3B0}
.pipe{margin-top:24px;height:120px;background:#F7FBFA;border-radius:14px;padding:12px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.pipe p{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#7E7E7E}
.pipe svg{width:100%;height:80px}
.pipe path{fill:none;stroke:#00A19B;stroke-width:3;stroke-dasharray:1400;stroke-dashoffset:1400}
.cap{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:14px;z-index:2}
</style></head><body>
<h2>Busy this month. Nothing booked for next month?</h2>
<div class="stage" id="sw"><p class="cap">You: chasing. DMs, follow-ups, posts.</p>
<div class="cam"><div class="app">
 <div class="cal" id="m0"><h3><span>October</span><span><em>0</em> calls</span></h3><div class="g"></div></div>
 <div class="cal" id="m1"><h3><span>November</span><span><em>0</em> calls</span></h3><div class="g"></div></div>
</div><div class="pipe"><p>Your pipeline</p><svg viewBox="0 0 1000 80" preserveAspectRatio="none"><path d="M0 76C120 70 200 8 300 10S420 70 500 76H860C920 76 960 30 1000 14"/></svg></div></div></div>
<script>
var gs = document.querySelectorAll('.g'), cam = document.querySelector('.cam'), cap = document.querySelector('.cap'), em = document.querySelectorAll('h3 em'), path = document.querySelector('path');
gs.forEach(function (g) { for (var i = 0; i < 20; i++) { var d = document.createElement('div'); d.textContent = i + 1; d.innerHTML += '<span class="ev">Call booked</span>'; g.appendChild(d); } });
var B = [1, 3, 5, 7, 8, 10, 12, 13], ev = gs[0].querySelectorAll('.ev');
function w(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function shot(tf, ms) { cam.animate([{ transform: getComputedStyle(cam).transform }, { transform: tf }], { duration: ms, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }); }
(async function run() { for (;;) {
  ev.forEach(function (e) { e.className = 'ev'; }); em[0].textContent = 0; document.getElementById('m1').classList.remove('empty');
  path.style.transition = 'none'; path.style.strokeDashoffset = 1400; path.getBoundingClientRect(); path.style.transition = 'stroke-dashoffset 2.6s linear';
  cap.textContent = 'You: chasing. DMs, follow-ups, posts.';
  shot('translate(-30%,-46%) rotateX(22deg) rotateZ(-6deg) scale(.9)', 1200); path.style.strokeDashoffset = 1000;
  for (var i = 0; i < B.length; i++) { await w(260); ev[B[i]].classList.add('on'); em[0].textContent = i + 1; }
  await w(600); cap.textContent = 'Clients sign. You deliver, the part you’re good at.'; path.style.strokeDashoffset = 700;
  for (i = 0; i < B.length; i++) { ev[B[i]].classList.add('dl'); await w(90); }
  await w(900); cap.textContent = 'Four weeks later: next month is empty.'; shot('translate(-70%,-46%) rotateX(22deg) rotateZ(-6deg) scale(.9)', 1400); path.style.strokeDashoffset = 300;
  await w(1200); document.getElementById('m1').classList.add('empty'); await w(1600);
  cap.textContent = 'Back to chasing.'; path.style.strokeDashoffset = 0; shot('translate(-50%,-50%) rotateX(22deg) rotateZ(-6deg) scale(.62)', 1400); await w(2600);
} })();
</script></body></html>
