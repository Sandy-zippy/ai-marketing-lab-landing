<section id="s1" class="sec" aria-labelledby="s1-h">
  <div class="wrap"><div class="grid">
    <div class="s1-tx stack">
      <h2 id="s1-h">Let me map your business.</h2>
      <p class="lede">45 minutes with me on where your clients leak.</p>
      <p class="lede">You keep the map and what to build first.</p>
      <p class="lede">₹999, credited if you join.</p>
      <a class="btn js-pay js-nudge" href="#">Map my business</a>
    </div>
    <div class="s1-vc">
      <div class="s1-tk" role="img" aria-label="Call ticket with Sandy's photo: 45 min with Sandy. ₹999, credited if you join.">
        <div class="s1-main">
          <img class="s1-ph" src="assets/s1-sandy-print.jpg" alt="" width="600" height="728" />
          <div class="s1-bd">
            <!-- ponytail: the ticket body IS a map (contours + a dashed route from Sandy past s2's leak pins to its flag): the s2 map's idea, so the ask reads "you leave with a map" with no new words.
                 Body is portrait at every width; keep pins and flag inside x 60-245, y 30-190, and nothing behind the label block (y over 195) so slice never crops them. -->
            <svg class="s1-map" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <g fill="none" stroke="var(--ink)" stroke-opacity=".2" stroke-width="1.1">
                <path d="M112 74C120 30 176 8 226 18S306 44 304 92 262 158 214 156 104 118 112 74Z"/>
                <path d="M146 82C150 52 186 38 220 44S270 64 268 94 240 134 210 130 142 112 146 82Z"/>
                <path d="M178 88C180 70 200 62 218 66S242 80 240 96 224 116 206 112 176 104 178 88Z"/>
                <path d="M-20 22C6 4 50 -4 78 12S96 52 70 66 20 74 -4 64-40 40-20 22Z"/>
                <path d="M-8 30C10 20 36 16 52 26S60 48 44 54 6 58-4 50-24 40-8 30Z"/>
                <path d="M-10 112C30 100 64 120 92 112S130 92 150 104"/>
              </g>
              <!-- the route: a start dot, past two of s2's leak pins, to s2's flag -->
              <circle cx="62" cy="190" r="4.5" fill="var(--ink)"/>
              <path d="M62 190C76 192 80 184 90 178S132 128 158 131S192 110 206 96" fill="none" stroke="var(--ink)" stroke-width="2.25" stroke-dasharray="6 7" stroke-linecap="round"/>
              <g transform="translate(75.7 137.7) scale(1.3)"><path d="M11 31C11 31 2 18 2 11a9 9 0 0 1 18 0c0 7-9 20-9 20z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><circle cx="11" cy="11" r="3.5" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M23 19c0 0-3.5 4.5-3.5 7a3.5 3.5 0 0 0 7 0c0-2.5-3.5-7-3.5-7z" fill="var(--ink)"/></g>
              <g transform="translate(143.7 90.7) scale(1.3)"><path d="M11 31C11 31 2 18 2 11a9 9 0 0 1 18 0c0 7-9 20-9 20z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><circle cx="11" cy="11" r="3.5" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M23 19c0 0-3.5 4.5-3.5 7a3.5 3.5 0 0 0 7 0c0-2.5-3.5-7-3.5-7z" fill="var(--ink)"/></g>
              <!-- s2's "what to build first" flag, same glyph: the route ends where the map says to start -->
              <g transform="translate(200.4 47) scale(1.4)"><path d="M4 35V2" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><path d="M5 3h19l-5 6 5 6H5z" fill="var(--ink)"/></g>
            </svg>
            <b class="s1-min"><svg class="s1-clk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 6.5V12l3.5 2.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>45 min</b>
            <span class="s1-with">with Sandy</span>
          </div>
        </div>
        <div class="s1-stub">
          <b class="s1-price"><svg class="s1-rs" viewBox="0 0 22 32" aria-hidden="true"><path d="M3 4.5H19M3 11.5H19M3 4.5H8.5a6.5 6.5 0 0 1 0 13H3L15 30" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linejoin="round"/></svg>999</b>
          <span class="s1-cr">credited if you join</span>
        </div>
      </div>
    </div>
  </div></div>
</section>
