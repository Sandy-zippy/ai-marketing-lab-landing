<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Training moved | AI Marketing Labs</title>
<link rel="canonical" href="https://aimarketinglabs.in/vsl/" />
<link rel="icon" href="../assets/favicon.svg" />
<link rel="stylesheet" href="../assets/aiml-funnel.css?v=6" />
<script src="../assets/analytics.js" defer></script>
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.moved{max-width:560px}
.moved img{width:190px;height:auto;margin-bottom:42px}
.moved h1{font-size:clamp(30px,6vw,50px);margin-bottom:18px}
.moved p{color:var(--text-mid);line-height:1.7;margin-bottom:28px}
.moved a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
</style>
</head>
<body class="grid-bg">
<main class="moved">
  <img src="../assets/aiml-logo-full-dark.svg" alt="AI Marketing Labs" />
  <h1>The current training page has moved.</h1>
  <p>Taking you to the current training page and release list now.</p>
  <a class="btn btn-accent" id="continueLink" href="./">Continue to the training page</a>
</main>
<script>
(function(){
  var destination='./'+location.search+location.hash;
  document.getElementById('continueLink').href=destination;
  document.addEventListener('DOMContentLoaded',function(){if(window.aimlTrack)window.aimlTrack('legacy_watch_redirect');});
  setTimeout(function(){location.replace(destination);},250);
})();
</script>
</body>
</html>
